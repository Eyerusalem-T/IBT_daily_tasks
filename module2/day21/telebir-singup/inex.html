<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleBirr Signup Form</title>
    <link rel="stylesheet" href="script.css">
</head>
<body>

  <div class="form-container">
    <h2>TeleBirr Signup</h2>

    <form id="signup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="phone">Ethiopian Phone Number</label>
        <input type="text" id="phone" name="phone" placeholder="0923232323">
      </div>

      <button type="submit">Sign Up</button>
    </form>

    <div id="error-area"></div>

    <div class="registered-section">
      <h3>Registered Users (<span id="user-count">0</span>)</h3>
      <ul id="user-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
