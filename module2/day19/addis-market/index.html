<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Market Shopping List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Addis Market Shopping List</h1>
      <p class="subtitle">Track your market items and total cost in ETB</p>
    </header>

    <!-- Item Input Form -->
    <form id="item-form" class="item-form">
      <div class="form-group">
        <label for="item-name">Item Name</label>
        <input 
          type="text" 
          id="item-name" 
          placeholder="e.g., Teff, Coffee, Tomatos" 
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label for="item-price">Price (ETB)</label>
        <input 
          type="number" 
          id="item-price" 
          placeholder="e.g., 250" 
          min="0.01" 
          step="0.01"
        />
      </div>

      <button type="submit" class="btn btn-add">Add Item</button>
    </form>

    <!-- Shopping List Section -->
    <main class="list-section">
      <ul id="shopping-list" class="shopping-list">
        <!-- Dynamic items will be appended here -->
      </ul>
    </main>

    <!-- Total Display -->
    <footer class="app-footer">
      <div class="total-container">
        <span>Total Price:</span>
        <span class="total-amount"><span id="total-price">0.00</span> ETB</span>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
