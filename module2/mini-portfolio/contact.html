<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact page for Eyerusalem's portfolio"
    />
    <title>Contact - Eyerusalem Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Contact Me</h1>
      <nav>
        <a href="index.html">Home</a> | <a href="about.html">About</a> |
        <a href="education.html">Education &amp; Skills</a> |
        <a href="projects.html">Projects</a> |
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Contact Information</h2>
        <p>Email: <strong>eyerusalem0201@gmail.com</strong></p>
        <p>Phone: <strong>+251 989188046</strong></p>
        <p>Location: Addis Ababa, Ethiopia</p>
      </section>

      <section>
        <h2>Send Me a Message</h2>
        <form action="#" method="post">
          <label for="name">Full Name:</label><br />
          <input
            type="text"
            id="name"
            name="name"
            required
            minlength="2"
            placeholder="Enter your full name"
          /><br /><br />

          <!-- Email input, required -->
          <label for="email">Email Address:</label><br />
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="you@example.com"
          /><br /><br />

          <!-- Telephone input -->
          <label for="phone">Phone Number:</label><br />
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="e.g. 0912345678"
          /><br /><br />

          <!-- Dropdown / select input -->
          <label for="reason">Reason for Contact:</label><br />
          <select id="reason" name="reason">
            <option value="general">General Question</option>
            <option value="project">Project Inquiry</option>
            <option value="job">Job Opportunity</option>
            <option value="other">Other</option></select
          ><br /><br />

          <label for="message">Your Message:</label><br />
          <textarea
            id="message"
            name="message"
            rows="5"
            cols="40"
            required
            minlength="10"
            placeholder="Write your message here..."
          ></textarea
          ><br /><br />

          <!-- Submit button -->
          <input type="submit" value="Send Message" />
          <input type="reset" value="Clear Form" />
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Eyerusalem. Built for my HTML Portfolio Project.</p>
    </footer>
  </body>
</html>
